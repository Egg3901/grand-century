<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Grand Century — compass-rose medallion -->
  <circle cx="24" cy="24" r="23.2" fill="#e9e3d4"/>
  <circle cx="24" cy="24" r="23.2" fill="none" stroke="#1f3a5f" stroke-width="1.4"/>
  <circle cx="24" cy="24" r="19.4" fill="none" stroke="#1f3a5f" stroke-width="0.7" stroke-opacity="0.5"/>
  <!-- bezel ticks -->
  <g stroke="#1f3a5f" stroke-width="0.9" stroke-opacity="0.55">
    <line x1="24" y1="4.6" x2="24" y2="7.4"/>
    <line x1="43.4" y1="24" x2="40.6" y2="24"/>
    <line x1="24" y1="43.4" x2="24" y2="40.6"/>
    <line x1="4.6" y1="24" x2="7.4" y2="24"/>
  </g>
  <!-- diagonal rose (viridian, behind) -->
  <path d="M35 13 L28.5 24 L35 35 L24 28.5 L13 35 L19.5 24 L13 13 L24 19.5 Z" fill="#1d6b5f"/>
  <!-- cardinal rose (Prussian) -->
  <path d="M24 5 L27.2 21 L43 24 L27.2 27 L24 43 L20.8 27 L5 24 L20.8 21 Z" fill="#1f3a5f"/>
  <!-- north point highlight -->
  <path d="M24 5 L27.2 21 L24 22 L20.8 21 Z" fill="#c0882c"/>
  <!-- hub -->
  <circle cx="24" cy="24" r="2.4" fill="#e9e3d4" stroke="#1f3a5f" stroke-width="1.1"/>
</svg>
