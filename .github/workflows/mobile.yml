name: Native mobile

on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/mobile/**', 'src/**', 'scripts/sync-mobile-atlas.mjs', 'package*.json', '.github/workflows/mobile.yml']
  push:
    branches: [master]
    paths: ['apps/mobile/**', 'src/**', 'scripts/sync-mobile-atlas.mjs', 'package*.json', '.github/workflows/mobile.yml']

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Web and mobile checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/mobile
      - run: node --test scripts/project-mobile-relief.test.mjs
      - run: npm run mobile:typecheck
      - run: npm --prefix apps/mobile run bundle:workers:ios
      - run: npx vitest run --project unit tests/mobile.mapLabelPlacement.test.ts
      - run: npm run build
  ios:
    name: iOS simulator compile
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CI: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/mobile
      - run: npm run mobile:atlas
      - name: Generate iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install
      - name: Install pods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Compile native app
        working-directory: apps/mobile
        run: >-
          xcodebuild -workspace ios/GrandCentury.xcworkspace
          -scheme GrandCentury -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/grand-century-derived"
          CODE_SIGNING_ALLOWED=NO build
