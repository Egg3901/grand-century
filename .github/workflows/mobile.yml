name: Native mobile

on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/mobile/**', 'src/**', 'scripts/sync-mobile-atlas.mjs', 'tests/graphics.terrain.test.ts', 'tests/perf.budgets.test.ts', 'tests/e2e/graphics-terrain.spec.ts', 'playwright.graphics.config.ts', 'playwright.native-graphics.config.ts', 'tests/native-graphics/**', 'scripts/ios-graphics-smoke.sh', 'scripts/mobile-flags.test.mjs', 'package*.json', '.github/workflows/mobile.yml']
  push:
    branches: [master]
    paths: ['apps/mobile/**', 'src/**', 'scripts/sync-mobile-atlas.mjs', 'tests/graphics.terrain.test.ts', 'tests/perf.budgets.test.ts', 'tests/e2e/graphics-terrain.spec.ts', 'playwright.graphics.config.ts', 'playwright.native-graphics.config.ts', 'tests/native-graphics/**', 'scripts/ios-graphics-smoke.sh', 'scripts/mobile-flags.test.mjs', 'package*.json', '.github/workflows/mobile.yml']

permissions:
  contents: read

concurrency:
  group: mobile-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # The world v8 map (2,141 provinces) roughly triples simulation cost, so the
    # unit suite runs as parallel shards instead of inside the checks job.
    name: Unit tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/mobile
      - run: npm test -- --maxWorkers=2 --shard=${{ matrix.shard }}/3
  checks:
    name: Web and mobile checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/mobile
      - run: node --test scripts/project-mobile-relief.test.mjs scripts/mobile-flags.test.mjs
      - run: npm run mobile:typecheck
      - run: npm --prefix apps/mobile run bundle:workers:ios
      - run: npm run build
        env:
          VITE_BASE: /games/grand-century/
      - name: Retain reviewed web distribution
        uses: actions/upload-artifact@v4
        with:
          name: web-refinement-release
          path: dist/
          if-no-files-found: error
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.graphics.config.ts
      - run: npx playwright test --config playwright.native-graphics.config.ts
  ios:
    name: iOS simulator render
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_PUBLIC_GRAPHICS_SMOKE: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/mobile
      - run: npm run mobile:atlas
      - name: Generate iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install
      - name: Install pods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Start simulator while compiling
        run: |
          device=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; ds=json.load(sys.stdin)["devices"]; print(next(d["udid"] for devices in ds.values() for d in devices if "iPhone" in d["name"]))')
          xcrun simctl boot "$device"
      - name: Compile native app
        working-directory: apps/mobile
        run: >-
          xcodebuild -workspace ios/GrandCentury.xcworkspace
          -scheme GrandCentury -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/grand-century-derived"
          CODE_SIGNING_ALLOWED=NO build
      - name: Render on an iPhone simulator
        timeout-minutes: 10
        run: bash scripts/ios-graphics-smoke.sh
      - name: Upload native rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-graphics-smoke
          path: ${{ runner.temp }}/graphics-evidence
          if-no-files-found: ignore
  android:
    name: Android release compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm ci --prefix apps/mobile
      - run: npm run mobile:atlas
      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Verify native Android rotation configuration
        run: |
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          root = ET.parse('apps/mobile/android/app/src/main/AndroidManifest.xml').getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          activity = next(a for a in root.findall('./application/activity') if a.get(ns + 'name', '').endswith('MainActivity'))
          orientation = activity.get(ns + 'screenOrientation')
          assert orientation in (None, 'unspecified', 'fullSensor', 'fullUser', 'sensor'), orientation
          print('Generated Android app permits portrait and landscape rotation.')
          PYTHON
      - name: Compile bundled native Android app
        working-directory: apps/mobile
        run: >-
          ./android/gradlew -p android assembleRelease --no-daemon
          --max-workers=2 -Dorg.gradle.parallel=false
          -Dorg.gradle.jvmargs=-Xmx3072m
          -PreactNativeArchitectures=arm64-v8a
      - name: Upload Android build for device verification
        uses: actions/upload-artifact@v4
        with:
          name: android-parity-release
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
