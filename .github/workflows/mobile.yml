name: Native mobile

on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/mobile/**', 'src/**', 'scripts/sync-mobile-atlas.mjs', 'tests/graphics.terrain.test.ts', 'tests/perf.budgets.test.ts', 'tests/e2e/graphics-terrain.spec.ts', 'playwright.graphics.config.ts', 'playwright.native-graphics.config.ts', 'tests/native-graphics/**', 'scripts/ios-graphics-smoke.sh', 'scripts/mobile-flags.test.mjs', 'package*.json', '.github/workflows/mobile.yml']
  push:
    branches: [master]
    paths: ['apps/mobile/**', 'src/**', 'scripts/sync-mobile-atlas.mjs', 'tests/graphics.terrain.test.ts', 'tests/perf.budgets.test.ts', 'tests/e2e/graphics-terrain.spec.ts', 'playwright.graphics.config.ts', 'playwright.native-graphics.config.ts', 'tests/native-graphics/**', 'scripts/ios-graphics-smoke.sh', 'scripts/mobile-flags.test.mjs', 'package*.json', '.github/workflows/mobile.yml']

permissions:
  contents: read

concurrency:
  group: mobile-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Web and mobile checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/mobile
      - run: node --test scripts/project-mobile-relief.test.mjs scripts/mobile-flags.test.mjs
      - run: npm run mobile:typecheck
      - run: npm --prefix apps/mobile run bundle:workers:ios
      - run: npm test -- --maxWorkers=2
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.graphics.config.ts
      - run: npx playwright test --config playwright.native-graphics.config.ts
  ios:
    name: iOS simulator render
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_PUBLIC_GRAPHICS_SMOKE: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/mobile
      - run: npm run mobile:atlas
      - name: Generate iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install
      - name: Install pods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Compile native app
        working-directory: apps/mobile
        run: >-
          xcodebuild -workspace ios/GrandCentury.xcworkspace
          -scheme GrandCentury -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/grand-century-derived"
          CODE_SIGNING_ALLOWED=NO build
      - name: Render on an iPhone simulator
        timeout-minutes: 10
        run: bash scripts/ios-graphics-smoke.sh
      - name: Upload native rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-graphics-smoke
          path: ${{ runner.temp }}/graphics-evidence
          if-no-files-found: ignore
